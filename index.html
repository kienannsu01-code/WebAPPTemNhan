<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a56db">
<title>FCA Cam - MGF</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:14px;max-width:560px;margin:auto;background:#f4f6f9;color:#111}
  h1{font-size:20px;margin:0 0 10px}
  input,select,button{width:100%;box-sizing:border-box;font-size:16px;padding:11px;margin:0 0 8px;border:1px solid #bbb;border-radius:8px;background:#fff}
  button{background:#fff;color:#1a56db;border:1px solid #1a56db;font-weight:600}
  label.b{display:block;text-align:center;background:#1a56db;color:#fff;border-radius:8px;padding:18px;font-size:22px;font-weight:600;margin-bottom:8px}
  #msg{padding:8px 0;font-size:14px;color:#444;min-height:20px}
  .it{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;word-break:break-all}
  .ok{color:#0a7a2f}.no{color:#c0392b}
  details{margin-bottom:10px}
  #cur{background:#e8f0fe;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px}
  .r{background:#fff;border:1px solid #bbb;border-radius:8px;padding:10px;margin-bottom:6px;font-size:15px}
  .r:active{background:#e8f0fe}
  #res{margin-bottom:8px}
</style>
</head>
<body>
<h1>FCA Cam - MGF</h1>

<details>
  <summary>Cài đặt (tên FCA + mã bảo vệ)</summary>
  <select id="fca"><option value="">-- Chọn tên FCA --</option></select>
  <input id="tok" type="password" placeholder="Mã bảo vệ">
  <label><input id="stamp" type="checkbox" checked style="width:auto"> Đóng dấu Style/PO/ngày giờ lên ảnh</label>
</details>

<div id="cur">Chưa chọn đơn</div>
<input id="q" placeholder="Tìm PO hoặc Style (gõ vài ký tự)" autocomplete="off">
<div id="res"></div>
<select id="style"><option value="">-- Chọn Style --</option></select>
<select id="po"><option value="">-- Chọn PO / Ngày giao --</option></select>
<select id="cat"></select>
<input id="note" placeholder="Ghi chú (lỗi, vị trí...)">

<label class="b" for="file">CHỤP ẢNH</label>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<button id="resend">Gửi lại ảnh chờ / cập nhật danh sách đơn</button>
<div id="msg">Sẵn sàng</div>
<div id="list"></div>

<script>
// ===== SỬA CÁC DÒNG NÀY MỘT LẦN RỒI ĐƯA LÊN HOSTING =====
const GS_URL = 'https://script.google.com/macros/s/AKfycbwPlVTrLvk0GeO4NxMfQpJuD1tSEMi1Fb7UJHZgBgV1EZU9IzEH_a925BHkWfTRETNE/exec';
const FCA_LIST = ['Nguyễn Minh Thu', 'Phan Thị Thùy'];   // thay bằng tên thật
const CATS = ['Carton','Label','Size','Loi','DongGoi','GGT','FPP','Khac'];
// ========================================================
const $ = id => document.getElementById(id);
const msg = t => $('msg').textContent = t;
const two = n => String(n).padStart(2, '0');
const clean = s => String(s).replace(/[^A-Za-z0-9-]/g, '');

CATS.forEach(c => $('cat').add(new Option(c, c)));
FCA_LIST.forEach(n => $('fca').add(new Option(n, n)));
['fca','tok'].forEach(id => {
  $(id).value = localStorage.getItem(id) || '';
  $(id).onchange = () => { localStorage.setItem(id, $(id).value); if (id === 'tok') loadOrders(); };
});

// ---- Hàng chờ gửi (IndexedDB): ảnh không bị mất khi mất mạng ----
const db = new Promise((res, rej) => {
  const r = indexedDB.open('fca', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('q', {keyPath: 'name'});
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => {
  const d = await db;
  return new Promise((res, rej) => {
    const t = d.transaction('q', mode);
    const q = fn(t.objectStore('q'));
    t.oncomplete = () => res(q && q.result);
    t.onerror = () => rej(t.error);
  });
};

// ---- Danh sách đơn từ sheet Order ----
let orders = JSON.parse(localStorage.getItem('orders') || '[]');
let log = JSON.parse(localStorage.getItem('log') || '[]');
const saveLog = () => localStorage.setItem('log', JSON.stringify(log.slice(-200)));

async function loadOrders() {
  if (GS_URL.startsWith('DAN_')) { fillStyles(); return msg('Chưa điền GS_URL trong file index.html'); }
  if (!$('tok').value) { fillStyles(); return msg('Hãy nhập mã bảo vệ trong Cài đặt'); }
  try {
    const r = await fetch(GS_URL + '?action=orders&token=' + encodeURIComponent($('tok').value));
    let j;
    try { j = await r.json(); }
    catch (e) { fillStyles(); return msg('Script không trả về dữ liệu: kiểm tra URL /exec, quyền "Bất kỳ ai" và đã triển khai phiên bản mới'); }
    if (j.ok) {
      orders = j.orders; localStorage.setItem('orders', JSON.stringify(orders));
      msg(orders.length ? 'Đã cập nhật ' + orders.length + ' đơn' : 'Tab Order không có dòng dữ liệu nào');
    } else msg(j.error === 'token' ? 'Mã bảo vệ chưa đúng' : 'Lỗi từ script: ' + j.error);
  } catch (e) { msg('Không kết nối được (mạng hoặc URL sai), dùng danh sách đã lưu'); }
  fillStyles();
}
function fillStyles() {
  const keep = localStorage.getItem('style') || $('style').value;
  $('style').length = 1;
  [...new Set(orders.map(o => o.style))].sort().forEach(s => $('style').add(new Option(s, s)));
  $('style').value = keep; fillPOs();
}
function fillPOs() {
  const keep = localStorage.getItem('pokey');
  $('po').length = 1;
  orders.forEach((o, i) => { if (o.style === $('style').value) $('po').add(new Option(`${o.po} — ${o.date || 'chưa có ngày giao'}`, i)); });
  const i = orders.findIndex(o => o.style === $('style').value && `${o.po}|${o.date}` === keep);
  if (i >= 0) $('po').value = i;
  showCur();
}
$('style').onchange = () => { localStorage.setItem('style', $('style').value); localStorage.removeItem('pokey'); fillPOs(); };
$('po').onchange = () => { const o = orders[$('po').value]; if (o) { localStorage.setItem('pokey', `${o.po}|${o.date}`); pushRecent(o); } showCur(); };

// ---- Tìm và chọn PO ----
const strip = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/gi, 'd').toLowerCase();
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okey = o => `${o.style}|${o.po}|${o.date}`;
function pushRecent(o) {
  const r = JSON.parse(localStorage.getItem('recent') || '[]').filter(k => k !== okey(o));
  r.unshift(okey(o));
  localStorage.setItem('recent', JSON.stringify(r.slice(0, 6)));
}
function showCur() {
  const o = orders[$('po').value];
  $('cur').textContent = o ? `Đang chọn: ${o.style} / PO ${o.po} / giao ${o.date || 'chưa có ngày'}` : 'Chưa chọn đơn';
}
function selectOrder(i) {
  const o = orders[i];
  if (!o) return;
  localStorage.setItem('style', o.style);
  localStorage.setItem('pokey', `${o.po}|${o.date}`);
  $('style').value = o.style; fillPOs();
  $('po').value = i; pushRecent(o); showCur();
}
function searchOrders() {
  const terms = strip($('q').value).split(/\s+/).filter(Boolean);
  let idx, title = '';
  if (terms.length) {
    idx = orders.map((o, i) => i).filter(i => {
      const h = strip(`${orders[i].po} ${orders[i].style} ${orders[i].date}`);
      return terms.every(t => h.includes(t));
    });
  } else {
    const r = JSON.parse(localStorage.getItem('recent') || '[]');
    idx = r.map(k => orders.findIndex(o => okey(o) === k)).filter(i => i >= 0);
    if (idx.length) title = 'Đơn chọn gần đây';
  }
  const total = idx.length;
  idx = idx.slice(0, 20);
  $('res').innerHTML =
    (title ? `<div style="font-size:13px;color:#555;margin-bottom:4px">${title}</div>` : '') +
    idx.map(i => `<div class="r" data-i="${i}"><b>PO ${esc(orders[i].po)}</b> — ${esc(orders[i].style)}<br><small>Giao: ${esc(orders[i].date) || 'chưa có ngày'}</small></div>`).join('') +
    (total > 20 ? `<div style="font-size:13px">Còn ${total - 20} kết quả nữa, gõ thêm để lọc</div>` : '') +
    (terms.length && !total ? '<div style="font-size:14px">Không tìm thấy đơn nào</div>' : '');
}
$('q').oninput = searchOrders;
$('q').onfocus = searchOrders;
$('res').onclick = e => {
  const d = e.target.closest('.r');
  if (d) { selectOrder(+d.dataset.i); $('q').value = ''; $('res').innerHTML = ''; }
};

// ---- Chụp ----
$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!$('fca').value) return msg('Hãy chọn tên FCA (mục Cài đặt)');
  const o = orders[$('po').value];
  if (!o) return msg('Hãy chọn Style và PO');

  const img = await createImageBitmap(f);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, c.width, c.height);

  const t = new Date(), cat = $('cat').value;
  const date = `${two(t.getDate())}/${two(t.getMonth()+1)}/${t.getFullYear()}`;
  const time = `${two(t.getHours())}:${two(t.getMinutes())}`;
  if ($('stamp').checked) {
    const fs = Math.round(c.width / 40);
    ctx.font = `bold ${fs}px sans-serif`; ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(`${o.style} ${o.po} ${cat}  ${date} ${time}`, fs/2, c.height - fs/2);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));

  const stt = log.filter(x => x.style === o.style && x.po === o.po && x.cat === cat).length + 1;
  const stamp = `${t.getFullYear()}${two(t.getMonth()+1)}${two(t.getDate())}_${two(t.getHours())}${two(t.getMinutes())}${two(t.getSeconds())}`;
  const name = `${clean(o.style)}_${clean(o.po)}_${cat}_${String(stt).padStart(3,'0')}_${stamp}.jpg`;
  const rec = {name, fca: $('fca').value, style: o.style, po: o.po, delivery: o.date,
               cat, stt, note: $('note').value, date, time, link: '', status: 'Chờ gửi'};
  await tx('readwrite', st => st.put({name, rec, blob}));
  log.push(rec); saveLog(); render();
  $('note').value = '';
  flush();
};

// ---- Gửi lên Drive + ghi Sheet (qua Apps Script) ----
const b64 = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
let flushing = false;
async function flush() {
  if (flushing || GS_URL.startsWith('DAN_')) return;
  flushing = true;
  const items = await tx('readonly', st => st.getAll()) || [];
  let ok = 0;
  for (const it of items) {
    try {
      msg(`Đang gửi ${ok + 1}/${items.length}...`);
      const r = await fetch(GS_URL, {method: 'POST', body: JSON.stringify(
        {...it.rec, token: $('tok').value, image: await b64(it.blob)})});
      const j = await r.json();
      if (!j.ok) { msg(j.error === 'token' ? 'Mã bảo vệ chưa đúng' : 'Lỗi: ' + j.error); break; }
      const x = log.find(l => l.name === it.name);
      if (x) { x.link = j.link; x.status = 'Đã lưu Drive'; }
      await tx('readwrite', st => st.delete(it.name));
      ok++;
    } catch (e) { msg('Chưa có mạng, ảnh được giữ trong máy và sẽ gửi sau'); break; }
  }
  if (ok) msg(`Đã lưu ${ok} ảnh lên Drive`);
  flushing = false; saveLog(); render();
}
$('resend').onclick = async () => { await loadOrders(); flush(); };
addEventListener('online', flush);

function render() {
  $('list').innerHTML = log.slice(-30).reverse().map(x =>
    `<div class="it">${x.name}<br>` +
    (x.link ? `<span class="ok">Đã lưu Drive</span> - <a href="${x.link}" target="_blank">mở ảnh</a>`
            : `<span class="no">Chờ gửi</span>`) +
    (x.note ? `<br>Ghi chú: ${x.note.replace(/</g, '&lt;')}` : '') + '</div>').join('');
}
render(); loadOrders(); flush();
</script>
</body>
</html>
