<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1a56db">
<title>FCA Cam - MGF</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:14px;max-width:560px;margin:auto;background:#f4f6f9;color:#111}
  h1{font-size:20px;margin:0 0 10px}
  input,select,button{width:100%;box-sizing:border-box;font-size:16px;padding:11px;margin:0 0 8px;border:1px solid #bbb;border-radius:8px;background:#fff}
  button{background:#1a56db;color:#fff;border:0;font-weight:600}
  button.alt{background:#fff;color:#1a56db;border:1px solid #1a56db}
  #cap{font-size:22px;padding:18px}
  label.b{display:block;text-align:center;background:#1a56db;color:#fff;border-radius:8px;padding:18px;font-size:22px;font-weight:600;margin-bottom:8px}
  label.b.alt{background:#fff;color:#1a56db;border:1px solid #1a56db;font-size:16px;padding:11px}
  .row{display:flex;gap:8px}
  #msg{padding:8px 0;font-size:14px;color:#444;min-height:20px}
  .it{background:#fff;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;word-break:break-all}
  .ok{color:#0a7a2f}.no{color:#c0392b}
  details{margin-bottom:10px}
</style>
</head>
<body>
<h1>FCA Cam - MGF</h1>

<details>
  <summary>Cài đặt (API key ImgBB)</summary>
  <input id="key" type="password" placeholder="80d7416f18e884d1949364297318e2be">
  <input id="fca" placeholder="Tên FCA (người chụp)">
  <input id="gs" placeholder="URL Google Apps Script (kết thúc bằng /exec)">
  <input id="tok" type="password" placeholder="Mã bảo vệ (trùng với TOKEN trong script)">
  <label><input id="stamp" type="checkbox" checked style="width:auto"> Đóng dấu PO + ngày giờ lên ảnh</label>
</details>

<input id="po" placeholder="PO" autocapitalize="characters">
<div class="row"><input id="style" placeholder="Style"><input id="color" placeholder="Màu"></div>
<select id="cat"></select>
<input id="note" placeholder="Ghi chú (lỗi, vị trí...)">

<label class="b" for="file">CHỤP ẢNH</label>
<input id="file" type="file" accept="image/*" capture="environment" hidden>

<label class="b alt" for="retry">Upload lại ảnh từ máy (ảnh chưa lên)</label>
<input id="retry" type="file" accept="image/*" multiple hidden>

<button class="alt" id="csv">Xuất danh sách CSV của PO này</button>
<div id="msg">Sẵn sàng</div>
<div id="list"></div>

<script>
const $ = id => document.getElementById(id);
const cats = ['Carton','Label','Size','Loi','DongGoi','Pallet','Container','Khac'];
cats.forEach(c => $('cat').add(new Option(c, c)));

let log = JSON.parse(localStorage.getItem('log') || '[]');
const save = () => localStorage.setItem('log', JSON.stringify(log));
const msg = t => $('msg').textContent = t;
const clean = s => s.replace(/[^A-Za-z0-9-]/g, '');
const two = n => String(n).padStart(2, '0');

['key','fca','gs','tok','po','style','color'].forEach(id => {
  $(id).value = localStorage.getItem(id) || '';
  $(id).oninput = () => localStorage.setItem(id, $(id).value);
});

$('file').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  const po = clean($('po').value);
  if (!po) return msg('Hãy nhập số PO trước');
  if (!$('key').value) return msg('Chưa có API key (mở mục Cài đặt)');

  // Nén về tối đa 1600px
  const img = await createImageBitmap(f);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, c.width, c.height);

  const t = new Date();
  const cat = $('cat').value;
  const style = clean($('style').value), color = clean($('color').value);
  const stampTxt = `${t.getFullYear()}${two(t.getMonth()+1)}${two(t.getDate())}_${two(t.getHours())}${two(t.getMinutes())}`;

  if ($('stamp').checked) {
    const fs = Math.round(c.width / 40);
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.fillStyle = '#ffe600';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(`${po} ${style} ${cat}  ${two(t.getDate())}/${two(t.getMonth()+1)}/${t.getFullYear()} ${two(t.getHours())}:${two(t.getMinutes())}`, fs/2, c.height - fs/2);
  }
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));

  const n = log.filter(x => x.po === po && x.cat === cat).length + 1;
  const name = `${po}_${style}_${color}_${cat}_${String(n).padStart(3,'0')}_${stampTxt}.jpg`;
  const rec = {name, po, style, color, cat, note: $('note').value, time: stampTxt, link: '', n,
    d: `${two(t.getDate())}/${two(t.getMonth()+1)}/${t.getFullYear()}`,
    h: `${two(t.getHours())}:${two(t.getMinutes())}`};
  log.push(rec); save();
  $('note').value = '';
  upload(rec, blob);
};

async function upload(rec, blob) {
  msg('Đang upload ' + rec.name + '...');
  try {
    const fd = new FormData();
    fd.append('image', blob, rec.name);
    fd.append('name', rec.name.replace('.jpg', ''));
    const r = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent($('key').value), {method: 'POST', body: fd});
    const j = await r.json();
    if (!j.success) throw new Error('fail');
    rec.link = j.data.url_viewer;
    msg('Đã upload: ' + rec.name);
  } catch (err) {
    // Lưu bản dự phòng vào máy (thư mục Tải xuống) để không mất ảnh
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = rec.name;
    a.click();
    msg('Chưa upload được. Ảnh đã lưu vào Tải xuống, dùng nút "Upload lại" khi có mạng.');
  }
  save(); render(); sendLog(rec);
}

// Ghi (hoặc cập nhật theo tên file) một dòng vào Google Sheet
function sendLog(rec) {
  const url = $('gs').value;
  if (!url) return;
  fetch(url, {method: 'POST', body: JSON.stringify({
    token: $('tok').value, fca: $('fca').value, name: rec.name,
    date: rec.d, time: rec.h, po: rec.po, style: rec.style, color: rec.color,
    cat: rec.cat, stt: rec.n, note: rec.note, link: rec.link,
    status: rec.link ? 'Đã upload' : 'Chưa upload'
  })}).then(r => r.json()).then(j => { if (!j.ok) throw 0; })
    .catch(() => msg('Chưa ghi được vào Google Sheet (kiểm tra URL và mã bảo vệ)'));
}

$('retry').onchange = async e => {
  let ok = 0;
  for (const f of e.target.files) {
    const rec = log.find(x => x.name === f.name && !x.link);
    if (rec) { await upload(rec, f); if (rec.link) ok++; }
  }
  e.target.value = '';
  msg('Upload lại xong: ' + ok + ' ảnh');
};

$('csv').onclick = () => {
  const po = clean($('po').value);
  const rows = log.filter(x => x.po === po);
  if (!rows.length) return msg('PO này chưa có ảnh');
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const csv = '\ufeffPO,Style,Mau,HangMuc,TenFile,GhiChu,ThoiGian,Link\n' +
    rows.map(x => [x.po,x.style,x.color,x.cat,x.name,x.note,x.time,x.link].map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'}));
  a.download = `${po}_danhsach.csv`;
  a.click();
};

function render() {
  const po = clean($('po').value);
  const rows = log.filter(x => !po || x.po === po).slice(-30).reverse();
  $('list').innerHTML = rows.map(x =>
    `<div class="it">${x.name}<br>` +
    (x.link ? `<span class="ok">Đã upload</span> - <a href="${x.link}" target="_blank">mở ảnh</a>` : `<span class="no">Chưa upload</span>`) +
    (x.note ? `<br>Ghi chú: ${x.note.replace(/</g,'&lt;')}` : '') + '</div>').join('');
}
$('po').addEventListener('input', render);
render();
</script>
</body>
</html>
